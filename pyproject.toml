[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dataplat"
version = "0.1.0"
description = "Reference NZ-style data platform: dbt, Airflow, Spark, Kafka, Snowflake adapter, FastAPI and Terraform."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Soumya Debnath" }]
dependencies = [
  "pandas>=2.2",
  "numpy>=1.26",
  "pyarrow>=16",
  "duckdb>=1.1",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pydantic>=2.8",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]
dbt = ["dbt-duckdb>=1.8"]
spark = ["pyspark>=3.5,<4"]
kafka = ["confluent-kafka>=2.5"]
snowflake = ["snowflake-connector-python>=3.12"]
airflow = ["apache-airflow>=2.10,<2.11"]

[project.scripts]
dataplat-generate = "dataplat.generate:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["."]
markers = [
  "spark: requires pyspark",
  "airflow: requires apache-airflow",
  "integration: requires an external service",
]
addopts = "-q"
