version: 2

models:
  - name: stg_orders
    columns:
      - name: order_id
        tests:
          - not_null
          - unique
      - name: customer_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_id
      - name: status
        tests:
          - accepted_values:
              arguments:
                values: ['paid', 'refunded', 'failed']
  - name: dim_customers
    columns:
      - name: customer_id
        tests:
          - not_null
          - unique
  - name: fct_daily_revenue
    columns:
      - name: revenue_nzd
        tests:
          - not_null
